  - {name: anytls@sing-box, type: anytls, server: 127.0.0.1, port: 10050, password: interop, sni: interop.prizmx.test, skip-cert-verify: true, interop: {}}
  - {name: ss2022-aes128@sing-box, type: ss, server: 127.0.0.1, port: 10060, cipher: 2022-blake3-aes-128-gcm, password: "ZGVmZ2hpamtsbW5vcHFycw==", udp: true, interop: {udp: true, half-close: true}}
