  - {name: vmess-tcp-none@sing-box, type: vmess, server: 127.0.0.1, port: 10030, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, alterId: 0, cipher: none, udp: true, interop: {udp: true, half-close: true}}
  - {name: vmess-tcp-zero@sing-box, type: vmess, server: 127.0.0.1, port: 10030, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, alterId: 0, cipher: zero, interop: {half-close: true}}
