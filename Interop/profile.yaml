# PrizmX interop profile: one node per protocol variant, all reachable on
# 127.0.0.1 through the ports docker-compose.yml publishes.
#
# The suite imports this file through the real config importer, starts the
# engine's mixed-port, and runs every node through it. mihomo loads the same
# nodes as the reference client (run.sh rewrites 127.0.0.1 for it).
#
# `interop:` holds what the suite expects of a node (default false / true):
#   udp:        UDP relay works (DNS query + datagram echo)
#   half-close: closeWrite reaches the target as EOF (TCP FIN or an in-band
#               end marker; not WebSocket / mux / simple-obfs / NW TLS)
#   reference:  mihomo must also pass (default true)
#   singbox:    profile.singbox.json carries an equivalent node (default true)
#   known-issue: {<family>: "reason"} for open bugs; those scenarios run as
#               known issues (reported, not failing) until fixed. Families:
#               http, https, tcp, half-close, udp
# Node names are `<protocol>-<variant>@<server>`.

proxies:
  # sing-box ------------------------------------------------------------------
  - {name: ss-aes128@sing-box, type: ss, server: 127.0.0.1, port: 10001, cipher: aes-128-gcm, password: interop, udp: true, interop: {udp: true, half-close: true}}
  - {name: ss-chacha@sing-box, type: ss, server: 127.0.0.1, port: 10002, cipher: chacha20-ietf-poly1305, password: interop, udp: true, interop: {udp: true, half-close: true}}
  - {name: ss-aes192@sing-box, type: ss, server: 127.0.0.1, port: 10003, cipher: aes-192-gcm, password: interop, udp: true, interop: {udp: true, half-close: true}}
  - {name: trojan-tls@sing-box, type: trojan, server: 127.0.0.1, port: 10010, password: interop, sni: interop.prizmx.test, skip-cert-verify: true, udp: true, interop: {udp: true}}
  - {name: trojan-ws-tls@sing-box, type: trojan, server: 127.0.0.1, port: 10011, password: interop, sni: interop.prizmx.test, skip-cert-verify: true, network: ws, ws-opts: {path: /trojan, headers: {Host: interop.prizmx.test}}, udp: true, interop: {udp: true}}
  - {name: socks5-auth@sing-box, type: socks5, server: 127.0.0.1, port: 10020, username: u, password: interop, udp: true, interop: {udp: true, half-close: true}}
  - {name: socks5@sing-box, type: socks5, server: 127.0.0.1, port: 10023, udp: true, interop: {udp: true, half-close: true}}
  - {name: http-auth@sing-box, type: http, server: 127.0.0.1, port: 10021, username: u, password: interop, interop: {half-close: true}}
  - {name: https-auth@sing-box, type: http, server: 127.0.0.1, port: 10022, username: u, password: interop, tls: true, sni: interop.prizmx.test, skip-cert-verify: true, interop: {}}
  - {name: vmess-tcp@sing-box, type: vmess, server: 127.0.0.1, port: 10030, uuid: b831381d-6324-4d53-ad4f-8cda48b30811, alterId: 0, cipher: auto, udp: true, interop: {udp: true, half-close: true}}
